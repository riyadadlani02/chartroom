[project]
name = "chartroom"
version = "0.1.0"
description = "Real-time documentation-gap catcher for clinical billing, built on the Corti API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
