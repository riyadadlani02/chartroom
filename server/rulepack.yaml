# CHARTROOM rulepack — one narrow workflow, end to end.
#
# Workflow: adult type 2 diabetes follow-up, primary care, established patient.
#
# Dollar figures are 2024 Medicare national non-facility averages for CPT, and
# for ICD-10 they are risk-adjustment (RAF) deltas priced at a $10,000 annual
# benchmark. Every number carries its arithmetic in `basis` so a coder in the
# room can argue with it. Swap them for your own fee schedule.

version: 1
workflow: "Adult type 2 diabetes follow-up · primary care · established patient"
systems: [icd10cm-outpatient, cpt]

# ---------------------------------------------------------------------------
# Requirements: the documentable elements a code stands or falls on.
# `question` is what the judge is asked. `ask` is what the clinician says out
# loud to close the gap — it has to be answerable in one sentence, in the room.
# ---------------------------------------------------------------------------
requirements:
  mdm_problems:
    label: "Problem complexity"
    question: >
      Does the clinician state the status of the chronic problem — whether it is
      stable, worsening, at goal, or off target — rather than only naming it?
    ask: "Say where the diabetes stands, not just that she has it."
    closes: "Looking at the trend, the diabetes is not at goal and it's drifted since the last review."
    cues: ["not at goal", "worsening", "uncontrolled", "stable", "off target", "exacerbation"]

  mdm_data:
    label: "Data reviewed"
    question: >
      Does the clinician state that they personally reviewed a specific test
      result, imaging study, or an outside clinician's note?
    ask: "Name the results and letters you actually reviewed."
    closes: "I've reviewed today's A1c and the letter from the eye clinic."
    cues: ["reviewed", "i looked at", "results show", "the report", "her labs", "his labs", "the letter from"]

  mdm_risk:
    label: "Risk / prescription management"
    question: >
      Does the clinician start, stop, or change a prescription medication, or
      discuss a decision with meaningful morbidity risk?
    ask: "State the medication decision out loud."
    closes: "I'm going to increase the metformin to one gram twice daily."
    cues: ["increase", "start you on", "stop the", "titrate", "reduce the dose", "switch"]

  em_time:
    label: "Total time on the date"
    question: >
      Is a total time for the encounter stated in minutes, attributed to this date?
    ask: "State the total time you spent on this visit today."
    closes: "That's thirty five minutes today including the record review."
    cues: ["minutes today", "total time", "minutes on this visit"]

  neuropathy_present:
    label: "Neuropathy documented"
    question: Does the record describe neuropathic symptoms or findings — numbness, tingling, burning feet, or reduced monofilament sensation?
    ask: "Ask about her feet before she leaves."
    closes: "Any numbness, tingling or burning in your feet?"
    cues: ["numbness", "tingling", "burning in", "pins and needles", "monofilament"]

  neuropathy_linked:
    label: "Causal link to diabetes"
    question: >
      Does the clinician explicitly attribute the neuropathy to the diabetes —
      "diabetic neuropathy", "neuropathy due to her diabetes", or equivalent?
      A mere co-mention of both is NOT a link.
    ask: "Attribute the neuropathy to the diabetes, in those words."
    closes: "This is diabetic peripheral neuropathy, the diabetes affecting the nerves in the feet."
    cues: ["diabetic peripheral neuropathy", "diabetic neuropathy", "diabetes affecting the nerves", "due to the diabetes", "due to her diabetes", "diabetes-related neuropathy", "secondary to diabetes"]

  ckd_present:
    label: "Renal impairment documented"
    question: Does the record show reduced kidney function — a low eGFR, raised creatinine, albuminuria, or a statement of chronic kidney disease?
    ask: "Say the renal numbers out loud."
    closes: "Your eGFR has come down to forty four with albumin in the urine."
    cues: ["egfr", "creatinine", "kidney function", "albumin to creatinine", "microalbumin"]

  ckd_staged:
    label: "CKD stage"
    question: >
      Is a specific CKD stage stated (stage 1 through 5, or 3a / 3b)? An eGFR
      value alone is not a stage.
    ask: "Give the kidney disease a stage. An eGFR is not a stage."
    closes: "An eGFR of forty four puts you at stage 3b chronic kidney disease."
    cues: ["stage 1", "stage 2", "stage 3", "stage 3a", "stage 3b", "stage 4", "stage 5"]

  ckd_linked:
    label: "Causal link to diabetes"
    question: Does the clinician attribute the kidney disease to the diabetes — "diabetic kidney disease", "diabetic nephropathy", or equivalent?
    ask: "Attribute the kidney disease to the diabetes."
    closes: "This is diabetic kidney disease, the diabetes affecting the filtering."
    cues: ["diabetic kidney", "diabetic nephropathy", "diabetes affecting the filtering", "diabetes-related kidney"]

  insulin_use:
    label: "Long-term insulin use"
    question: Is the patient described as currently using insulin on an ongoing basis?
    ask: "Confirm she is on insulin long term."
    closes: "You're continuing on your long acting insulin at night."
    cues: ["insulin", "lantus", "basal", "novorapid", "tresiba", "glargine"]

  tobacco_counselled:
    label: "Cessation counselling delivered"
    question: >
      Does the clinician deliver actual smoking-cessation counselling — advice to
      quit, a method, or a referral — as opposed to only recording smoking status?
    ask: "You counselled her. Put what you said on the record."
    closes: "I'd advise you to stop, and I'll start you on nicotine replacement patches today."
    cues: ["quit", "cessation", "patches", "nicotine replacement", "stop smoking", "varenicline"]

  tobacco_time:
    label: "Counselling time"
    question: Is the duration of the cessation counselling stated, and is it more than three minutes?
    ask: "Add how long the cessation conversation took."
    closes: "We spent about five minutes talking through quitting."
    cues: ["minutes talking", "five minutes", "spent about"]

  foot_exam:
    label: "Foot examination"
    question: Is a diabetic foot examination described — inspection, pulses, or monofilament testing?
    ask: "Narrate the foot exam as you do it."
    closes: "Pedal pulses present, monofilament sensation reduced on the left forefoot."
    cues: ["foot exam", "monofilament", "pedal pulses", "checked your feet", "examined the feet"]

# ---------------------------------------------------------------------------
# Codes. `requires` is the defence. `watch: true` means hunt for it even when
# Corti has not predicted it — that is how UNCAPTURED gaps get found.
# ---------------------------------------------------------------------------
codes:
  - code: "99214"
    system: cpt
    display: "Office visit, established patient, moderate MDM"
    gap_type: SUPPORT
    watch: true
    value_usd: 129
    downgrade: { code: "99213", display: "Office visit, established patient, low MDM", value_usd: 92 }
    basis: "99214 $129 − 99213 $92 = $37 at risk on a downgrade. 2024 Medicare national non-facility."
    requires:
      any_of:
        - n_of: { n: 2, of: [mdm_problems, mdm_data, mdm_risk] }
        - em_time

  - code: "E11.40"
    system: icd10cm-outpatient
    display: "Type 2 diabetes mellitus with diabetic neuropathy, unspecified"
    gap_type: LINKAGE
    watch: true
    trigger: neuropathy_present
    value_usd: 1970
    downgrade: { code: "E11.9", display: "Type 2 diabetes mellitus without complications", value_usd: 0 }
    basis: "HCC 18 (0.302) − HCC 19 (0.105) = 0.197 RAF × $10,000 benchmark ≈ $1,970/yr."
    requires:
      all_of: [neuropathy_present, neuropathy_linked]

  - code: "E11.22"
    system: icd10cm-outpatient
    display: "Type 2 diabetes mellitus with diabetic chronic kidney disease"
    gap_type: STAGING
    watch: true
    trigger: ckd_present
    value_usd: 690
    downgrade: { code: "N18.9", display: "Chronic kidney disease, unspecified stage", value_usd: 0 }
    basis: "Stage 3b+ CKD risk-adjusts (≈0.069 RAF); unstaged CKD does not. 0.069 × $10,000 ≈ $690/yr."
    requires:
      all_of: [ckd_present, ckd_linked, ckd_staged]

  - code: "99406"
    system: cpt
    display: "Smoking cessation counselling, 3–10 minutes"
    gap_type: UNCAPTURED
    watch: true
    trigger: tobacco_counselled
    value_usd: 16
    basis: "99406 ≈ $16. Performed in most diabetes reviews, billed in almost none."
    requires:
      all_of: [tobacco_counselled, tobacco_time]

  - code: "Z79.4"
    system: icd10cm-outpatient
    display: "Long term (current) use of insulin"
    gap_type: COHERENCE
    watch: true
    trigger: insulin_use
    value_usd: 0
    basis: "No RAF value. Its absence contradicts a note that describes insulin, and that inconsistency is what an audit pulls on."
    requires:
      all_of: [insulin_use]
